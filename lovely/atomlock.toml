[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# Give Atom its id (why is this not a vanilla thing ???????)
[[patches]]
[patches.pattern]
target = "states/AtomMap.lua"
pattern = '''function st:buildAtom(atomData, layer)
	layer = layer or 0
	local atom = em.init("Atom", { atomLayer = layer })'''
position = "after"
payload = '''

atom.id = atomData.id or "IDMISSINGFUCK"

atom.apID = (atomData.icon or "Base"):gsub('images/',"")

'''
match_indent = true



# Stop player from accessing atom
[[patches]]
[patches.pattern]
target = "states/AtomMap.lua"
pattern = 'function st:selectAtom(newAtom, skipanim, speedOverride)'
position = "after"
payload = '''
local atID = newAtom.apID
print(atID)
if ap.connected and atID ~= "Base" then
    local APIID = ap.data.atom_keys[atID]
    print(APIID)
    ap.utils.printTable(ap.data.received)
    -- Check for Atom Key
    local yesnt = false
    for x,y in ipairs(ap.data.received) do
        yesnt = y == APIID
        if yesnt then break end
    end

    -- intro always unlocked
    yesnt = yesnt or (atID == "square")


    if not yesnt then return end
end
'''
match_indent = true



# Change Atom Icon
[[patches]]
[patches.pattern]
target = "states/AtomMap.lua"
pattern = '''		else
			atom.icon = love.graphics.newImage(self.basePath .. "/" .. atomData.icon .. ".png")
		end'''
position = "at"
payload = '''
else
    
    if ap.connected then
        local atID = atom.apID
        local APIID = ap.data.atom_keys[atID]


        local yesnt = false
            for x,y in ipairs(ap.data.received) do
                yesnt = y == APIID
                if yesnt then break end
            end
        yesnt = yesnt or (atID == "square")
        
        if not yesnt then atom.icon = love.graphics.newImage("assets/menu/lock.png") else
	    atom.icon = love.graphics.newImage(self.basePath .. "/" .. atomData.icon .. ".png")
        end
        
    else
        
	    atom.icon = love.graphics.newImage(self.basePath .. "/" .. atomData.icon .. ".png")
    end
end
'''
match_indent = true