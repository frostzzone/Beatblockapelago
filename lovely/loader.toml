[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# AP module
[[patches]]
[patches.module]
source = "ap/init.lua"
before = "main.lua"
name = "ap"

[[patches]]
[patches.module]
source = "ap/gui.lua"
before = "main.lua"
name = "ap.gui"

[[patches]]
[patches.module]
source = "ap/utils.lua"
before = "main.lua"
name = "ap.utils"

# Load ap files AFTER after dpf is loaded :cute:
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "dpf.patchLoveFilesystem()"
position = "after"
payload = '''ap = require("ap")'''
match_indent = true

# Poll ap client every frame
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.update(d)"
position = "after"
payload = '''if ap.client ~= nil then
	ap.client:poll()
end'''
match_indent = true

# FISH 
[[patches]]
[patches.pattern]
target = "states/Fishing.lua"
pattern = "if new or not savedata.fishing.hasBook then" # ExtraStuff mod chnages [function st:startShowCatch(fish,new)]
position = "before"
payload = '''
if ap.client ~= nil then
	ap.checkFish(fish)
end
'''
match_indent = true