# Send Results
[[patches]]
[patches.pattern]
target = "states/Results.lua"
pattern = "savedata.lastPlayedLevel = cLevel"
position = "after"
payload = '''
if ap.client ~= nil then
	ap.checkResults(cLevel, self)
end
'''
match_indent = true


# add menu button
[[patches]]
[patches.pattern]
target = "states/Menu.lua"
pattern = "self.mainMenu:addOption('credits',function()"
position = "before"
payload = '''
self.mainMenu:addOption('Archipelago', function()
	cs = bs.load('AP')
	cs.bg = self.bg
	self.menuMusicManager:clearOnBeatHooks()
	self:leave()
	cs.menuMusicManager = self.menuMusicManager
	cs:init()
end, 17 * 8, nil, sprites.menu.archipelago)
'''
match_indent = true