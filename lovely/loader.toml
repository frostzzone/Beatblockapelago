[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

# AP module
[[patches]]
[patches.module]
source = "ap/init.lua"
before = "main.lua"
name = "ap"

[[patches]]
[patches.module]
source = "ap/gui.lua"
before = "main.lua"
name = "ap.gui"

[[patches]]
[patches.module]
source = "ap/utils.lua"
before = "main.lua"
name = "ap.utils"

# Load ap files
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.load(args)"
position = "after"
payload = '''ap = require("ap")'''
match_indent = true

# Poll ap client every frame
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.update(d)"
position = "after"
payload = '''if ap.client ~= nil then
	ap.client:poll()
end'''
match_indent = true

# FISH 
[[patches]]
[patches.pattern]
target = "states/Fishing.lua"
pattern = "if new or not savedata.fishing.hasBook then" # ExtraStuff mod chnages [function st:startShowCatch(fish,new)]
position = "before"
payload = '''
if ap.client ~= nil then
	ap.checkFish(fish)
end
'''
match_indent = true

# temp inf stamina
# [[patches]]
# [patches.pattern]
# target = "states/Fishing.lua"
# pattern = "savedata.fishing.fishingPower = savedata.fishing.fishingPower - 1"
# position = "at"
# payload = '''-- savedata.fishing.fishingPower = savedata.fishing.fishingPower - 1'''
# match_indent = true

# Send Results
[[patches]]
[patches.pattern]
target = "states/Results.lua"
pattern = "savedata.lastPlayedLevel = cLevel"
position = "after"
payload = '''
if ap.client ~= nil then
	ap.checkResults(cLevel, self)
end
'''
match_indent = true


# add menu button
[[patches]]
[patches.pattern]
target = "states/Menu.lua"
pattern = "self.mainMenu:addOption('credits',function()"
position = "before"
payload = '''
self.mainMenu:addOption('Archipelago', function()
	if not ap.connected then
		cs = bs.load('AP')
	else 
		cs = bs.load('ap-connected')
	end
	cs.bg = self.bg
	self.menuMusicManager:clearOnBeatHooks()
	self:leave()
	cs.menuMusicManager = self.menuMusicManager
	cs:init()
end, 17 * 8, nil, sprites.menu.archipelago)
'''
match_indent = true